services:
  # Nginx + PHP-FPM
  app:
    image: php:8.4-fpm-alpine
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
    depends_on:
      - pgsql
      - redis
      - typesense
      - tika
    networks:
      - agentoom

  nginx:
    image: nginx:alpine
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "80:80"
    depends_on:
      - app
    networks:
      - agentoom

  # PostgreSQL
  pgsql:
    image: postgres:16-alpine
    volumes:
      - pgsql-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: agentoom
      POSTGRES_USER: agentoom
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    networks:
      - agentoom
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentoom"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    networks:
      - agentoom
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Horizon
  horizon:
    image: php:8.4-fpm-alpine
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    command: php artisan horizon
    environment:
      - APP_ENV=production
    depends_on:
      - pgsql
      - redis
    networks:
      - agentoom

  # Scheduler (cron)
  scheduler:
    image: php:8.4-fpm-alpine
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    command: |
      sh -c 'while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done'
    environment:
      - APP_ENV=production
    depends_on:
      - pgsql
      - redis
    networks:
      - agentoom

  # Queue workers
  worker-documents:
    image: php:8.4-fpm-alpine
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    command: php artisan queue:work redis --queue=documents --sleep=3 --tries=3 --backoff=30,120,600
    environment:
      - APP_ENV=production
    depends_on:
      - pgsql
      - redis
    networks:
      - agentoom

  worker-providers:
    image: php:8.4-fpm-alpine
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    command: php artisan queue:work redis --queue=providers --sleep=3 --tries=3 --backoff=60,300
    environment:
      - APP_ENV=production
    depends_on:
      - pgsql
      - redis
    networks:
      - agentoom

  worker-default:
    image: php:8.4-fpm-alpine
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    command: php artisan queue:work redis --queue=default --sleep=3 --tries=3
    environment:
      - APP_ENV=production
    depends_on:
      - pgsql
      - redis
    networks:
      - agentoom

  # Typesense
  typesense:
    image: typesense/typesense:27.0
    volumes:
      - typesense-data:/data
    command: --data-dir /data --api-key=${TYPESENSE_API_KEY} --enable-cors
    environment:
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY}
    networks:
      - agentoom
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8108/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Apache Tika
  tika:
    image: apache/tika:latest-full
    networks:
      - agentoom
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9998/tika"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  pgsql-data:
  redis-data:
  typesense-data:

networks:
  agentoom:
    driver: bridge
